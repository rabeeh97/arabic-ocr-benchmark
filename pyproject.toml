[project]
name = "arabic-ocr-bench"
version = "0.1.0"
description = "A reproducible benchmark for Arabic cursive script recognition (HTR) with LLMs / VLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rabeeh97" }]

dependencies = [
    "jiwer>=3.0",
    "datasets>=3.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "pandas>=2.0",
    "pyarabic>=0.6.15",
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
]

[project.optional-dependencies]
# local open-weight / Arabic-specific models (Qwen2.5-VL, Qari-OCR, PaliGemma, ...)
local = [
    "torch>=2.2",
    "transformers>=4.49",
    "accelerate>=0.30",
    "qwen-vl-utils>=0.0.8",
    "peft>=0.11",
    "sentencepiece>=0.2",
    "psutil>=5.9",           # pre-load RAM check so a too-big model is skipped, not OOM-killed
]
# fine-tuning: LoRA/QLoRA SFT of the local VLMs + encoder-decoder models.
# Needs the `local` extra too (torch, transformers, peft, accelerate).
train = [
    "trl>=0.12",
    "bitsandbytes>=0.44",     # 4-bit base weights for QLoRA (CUDA only)
    "imagehash>=4.3",         # perceptual hashing for the contamination check
    "datasets>=3.0",          # already a core dep; listed for clarity
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bench = "arabic_ocr_bench.cli:main"
bench-train = "arabic_ocr_bench.training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_ocr_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# EXE002: every file on the exFAT external drive reports as executable — noise here.
ignore = ["EXE002"]
