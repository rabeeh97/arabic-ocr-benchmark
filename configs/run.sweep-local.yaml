# Local-model sweep for Google Colab (free T4, 16 GB).
# The runner is model-major: it loads one model, runs every line, frees it,
# then loads the next — so this fits on a single GPU. ~ (n lines) x (models) x 1-3 s.
#
#   from arabic_ocr_bench.runner import run
#   from arabic_ocr_bench.report import score_run
#   import yaml; rd = run(yaml.safe_load(open("configs/run.sweep-local.yaml")))
#   print(open(score_run(rd)).read())

models:
  - qari-ocr-0.3          # Arabic-specific, full model
  - qari-ocr-0.2          # Arabic-specific, base + LoRA
  - qwen2.5-vl-3b         # general VLM baseline
  # - qwen2.5-vl-7b       # needs 4-bit on a free T4: add `load_in_4bit: true` in
  #                        configs/models.yaml and `!pip install -q bitsandbytes`
  # - paligemma-arabic-hw # line-only; gated base -> needs HF license + HF_TOKEN

datasets:
  - muharaf_lines          # the only real dataset wired for Colab today

limit: 100                 # bump to null for the full 1,334-line test split
prompt_version: line-v1
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 1             # single GPU
max_retries: 2
cache: true
results_dir: results
