# Local-model sweep for Google Colab (T4 GPU; CPU falls back to a smoke test).
# The runner is model-major: load one model, run every line, free it, load the
# next. The 7B models load 4-bit and fit a T4; on CPU they are dropped
# automatically (no 4-bit, and fp32 7B OOMs a 12 GB box).
#
#   from arabic_ocr_bench.sweep import run_sweep
#   run_sweep(models=..., dataset="muharaf_lines", partial_limit=25, run_full=True,
#             manifest_path="results/sweep_manifest.json", results_dir="results")

models:
  - qari-ocr-0.2         # Arabic OCR, 2B, raw-text focused
  - qari-ocr-0.3         # Arabic OCR, 2B, structure-first
  - qwen2-vl-2b          # untuned base — anchor
  - qwen2.5-vl-3b        # general VLM, 3B
  - qwen2.5-vl-7b        # general VLM, 7B (4-bit on GPU)  -> needs `pip install bitsandbytes`
  - ain-7b              # Arabic-centric VLM, 7B (4-bit on GPU)
  # - paligemma-arabic-hw  # line-only; gated base -> HF license + HF_TOKEN

datasets:
  - muharaf_lines          # the only real dataset wired for Colab today

partial_limit: 25          # quick pass per model
run_full: true             # then the full 1,334-line test split
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]
concurrency: 1
