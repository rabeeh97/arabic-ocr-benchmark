# Offline pipeline check: mock models x the in-repo synthetic dataset.
# No network, no API keys, no downloads. Proves runner -> report end to end.
#   uv run bench run --config configs/run.yaml --report

models:
  - mock_empty            # -> CER ~1.0  (sanity floor)
  - mock_echo             # -> CER  0.0  (sanity ceiling)

datasets:
  - synthetic

limit: 10
prompt_version: line-v1
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 4
max_retries: 3
cache: true
results_dir: results
