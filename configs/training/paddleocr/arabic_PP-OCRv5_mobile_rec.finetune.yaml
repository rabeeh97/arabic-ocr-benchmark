# Overlay for PaddleOCR `tools/train.py` fine-tuning of
# arabic_PP-OCRv5_mobile_rec. Paths are rewritten by
# scripts/finetune_paddleocr.py into the experiment dir — do not point
# tools/train.py at this file as-is.
#
# Do NOT launch a GPU train while the suite_v1 VLM run owns the 3090.
#
# max_text_length is raised from the upstream default of 25: Arabic
# manuscript lines in Muharaf/RASAM routinely exceed that, and CTC/NRTR
# would silently clip. 80 is a first guess; revisit if eval acc plateaus
# because the NRTR head had to reinit extra positions.

Global:
  model_name: arabic_PP-OCRv5_mobile_rec
  use_gpu: true
  epoch_num: 20
  print_batch_step: 10
  save_model_dir: PLACEHOLDER_SAVE_DIR
  save_epoch_step: 1
  eval_batch_step: [0, 200]
  cal_metric_during_train: true
  pretrained_model: PLACEHOLDER_PRETRAINED
  character_dict_path: PLACEHOLDER_DICT
  max_text_length: &max_text_length 80
  use_space_char: true
  distributed: false

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: PLACEHOLDER_DATA_DIR
    ext_op_transform_idx: 1
    label_file_list:
      - PLACEHOLDER_TRAIN_LIST
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 32
    fix_bs: false
    divided_factor: [8, 16]
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: PLACEHOLDER_DATA_DIR
    label_file_list:
      - PLACEHOLDER_VAL_LIST
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: [image, label_ctc, label_gtc, length, valid_ratio]
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 2
