# RTX 3090 experiment — QLoRA on QCRI's Fanar-2-Oryx-IVU (Qwen2.5-VL-7B family,
# ViT frozen). A second Arabic-specialised base alongside Baseer-Nakba (base-model
# A/B/C, docs/experiments/findings-and-notes.md) — Fanar is NOT OCR-tuned (it's a
# general Arabic-first vision-language model for "culturally-aware image
# understanding"; see docs/models.md's Fanar section and the un-adapted
# `fanar-oryx-7b` eval row in configs/models.yaml), unlike Baseer, which already
# specializes in manuscript HTR. Tests whether an Arabic-first *general* VLM base
# is a better or worse starting point for this recipe than either a generic base
# (Qwen3-VL-4B) or an already-OCR-specialised one (Baseer-Nakba).
#
# QLoRA, not plain bf16 LoRA: same reasoning as exp3090_qwen3vl8b.yaml — a 7B
# model plus its own bf16 gradients/optimizer state doesn't comfortably fit a
# single 3090's 24 GB; 4-bit weights (BitsAndBytesConfig, nf4 + double-quant,
# bf16 compute dtype) free up the headroom, the same way the existing
# `fanar-oryx-7b` / `nakba-warraq-fanar` EVAL rows already need `load_in_4bit: true`
# just to inference on a T4 (see configs/models.yaml). ViT frozen here for the
# same VRAM reason; see exp3090_fanar2_visft.yaml for the unfrozen sibling.
#
# QCRI/Fanar-2-Oryx-IVU is NOT gated on HF (no license click-through noted for
# the existing fanar-oryx-7b / nakba-warraq-fanar eval rows) -- no extra HF_TOKEN
# license-acceptance step needed beyond the token already required for Muharaf.
experiment: exp3090-fanar2
method: qlora            # 4-bit NF4 base + LoRA adapter -- see header note above.

base_model:
  hf_id: QCRI/Fanar-2-Oryx-IVU
  arch: qwen2_5_vl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  train_vision: false    # frozen -- no VRAM headroom left after 4-bit + 7B; see header

data:
  sources:
    - name: muharaf_train
      adapter: arabic_ocr_bench.datasets.muharaf_lines:MuharafLines
      hf_id: aamijar/muharaf-public
      split: train
      limit: 8000         # same 8k lines as the other single-source base configs
  val_fraction: 0.03
  prompt_version: line-v2

image:
  min_pixels: 200704      # 448*448
  max_pixels: 702464      # ~896*784 -- same reduced cap as exp3090_qwen3vl8b.yaml;
                           # 7B+4-bit leaves less headroom for large image tokens.

train:
  epochs: 1
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 8
  scheduler: cosine
  warmup_ratio: 0.03
  seed: 0
  bf16: true
  gradient_checkpointing: true
  max_seq_len: 1024
  save_strategy: steps
  save_steps: 100         # frequent checkpoints — this box reboots/gets killed a lot
  save_total_limit: 5
  resume: true             # re-run -> continues from the newest checkpoint-*
  push_to_hub: false

# The experiment script overrides output_dir to <exp-folder>/runs/<experiment>.
output_dir: results/training/exp3090-fanar2
eval_datasets: [muharaf_lines]
