# RTX 3090 experiment — same recipe as exp3090_qwen3vl4b.yaml, but with the
# ViT unfrozen (train_vision: true). Tests the open question from the base-model
# A/B/C write-up (docs/experiments/findings-and-notes.md): all three bases land
# at 45-54% CER on the Maghrebi RASAM sets even after fine-tuning, worse than on
# Naskh/Ruq'ah — is a frozen vision encoder the bottleneck for an unfamiliar
# script family? Everything else (data, epochs, LR, rank) is held identical to
# exp3090-qwen3vl4b so the only variable is train_vision.
#
# Base needs transformers>=4.57 — the experiment script installs it into the
# self-contained venv; the core benchmark env stays at 4.49.
experiment: exp3090-qwen3vl4b-visft
method: lora            # bf16 LoRA. Unfrozen ViT uses more VRAM — drop image.max_pixels first if you OOM.

base_model:
  hf_id: Qwen/Qwen3-VL-4B-Instruct
  arch: qwen3_vl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  train_vision: true    # <-- the one change vs exp3090_qwen3vl4b.yaml

data:
  sources:
    - name: muharaf_train
      adapter: arabic_ocr_bench.datasets.muharaf_lines:MuharafLines
      hf_id: aamijar/muharaf-public
      split: train
      limit: 8000        # same 8k lines as exp3090-qwen3vl4b — only train_vision differs
  val_fraction: 0.03
  prompt_version: line-v2

image:
  min_pixels: 200704     # 448*448
  max_pixels: 1003520    # ~1120*896 — lower this first if unfreezing the ViT OOMs

train:
  epochs: 1
  lr: 1.0e-4
  batch_size: 1
  grad_accum: 8
  scheduler: cosine
  warmup_ratio: 0.03
  seed: 0
  bf16: true
  gradient_checkpointing: true
  max_seq_len: 1024
  save_strategy: steps
  save_steps: 100        # frequent checkpoints — this box reboots/gets killed a lot
  save_total_limit: 5
  resume: true           # re-run -> continues from the newest checkpoint-*
  push_to_hub: false

# The experiment script overrides output_dir to <exp-folder>/runs/<experiment>.
output_dir: results/training/exp3090-qwen3vl4b-visft
eval_datasets: [muharaf_lines]
