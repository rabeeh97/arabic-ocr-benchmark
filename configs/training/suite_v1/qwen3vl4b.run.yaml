# Held-out in-domain eval for suite-v1-qwen3vl4b — score the merged fine-tune
# on the UNTOUCHED muharaf_lines test split. Run by scripts/run_3090_experiment.py
# after merge, or by hand:
#   uv run bench run --config configs/training/suite_v1/qwen3vl4b.run.yaml --report
models:
  - suite-v1-qwen3vl4b-ft
datasets:
  - muharaf_lines
limit: 200
offset: 0
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]
concurrency: 1
max_retries: 2
cache: true
results_dir: results
