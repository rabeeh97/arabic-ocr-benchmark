# Fine-tuning experiment ledger — feeds the leaderboard's "Fine-tuning" tab
# (scripts/make_leaderboard.py -> _render_finetuning). One entry per training
# run: what was trained, from what, and which already-scored rows are its
# base / fine-tuned pair. The tab reads CER etc. straight from the benchmark
# results — it does not run anything.
#
# Fields:
#   title            short human name
#   base_model       models.yaml row name of the UNtuned starting point
#   ft_models        list of models.yaml row names of the fine-tune(s)
#   training         one-line recipe summary (method, data, epochs)
#   config           path to the training config (for the "recipe" link)
#   in_domain        {dataset, note} — the held-out split of the TRAINING corpus
#   holdout_datasets datasets disjoint from the training data (the real test of
#                    generalisation); the tab tabulates base vs ft on each
#   hypothesis       why this fine-tune was expected to help (free text)
#   notes            list of short observations / open questions

exp3090-qwen3vl4b:
  title: "Qwen3-VL-4B — Muharaf LoRA (RTX 3090)"
  base_model: qwen3-vl-4b-bf16
  ft_models: [exp3090-qwen3vl4b-ft-bf16]
  training: "bf16 LoRA (r=16, α=32, ViT frozen), 1 epoch, 8,000 Muharaf train lines, Qwen3-VL-4B-Instruct"
  config: configs/training/exp3090_qwen3vl4b.yaml
  in_domain:
    dataset: muharaf_lines
    note: "held-out test split of the same Muharaf corpus the LoRA trained on"
  holdout_datasets:
    - kitab_khatt
    - nakba_lines
    - rasam1
    - rasam2
    - kitab_hindawi
    - kitab_historicalbooks
  hypothesis: >-
    A general VLM has the visual features but no prior for cursive Arabic line
    layout, ligature segmentation, or diacritic placement. A small LoRA on real
    Ruq'ah handwriting should teach the decoder the output distribution (line =
    one clean transcript, no commentary) and the script's grapheme inventory,
    and that should transfer to other Arabic handwriting, not just Muharaf.
  notes:
    - "Base Qwen3-VL-4B is near-unusable on cursive handwriting (~0.87 CER-light on KHATT / NAKBA smoke) — it mostly produces meta-commentary or wrong-script output; the fine-tune's first win is just emitting a bare line transcript."
    - "Gain transfers off-corpus: on KITAB-KHATT and NAKBA (neither in training) the LoRA cuts CER-light by 0.49 / 0.60 — similar magnitude to its in-domain Muharaf gain — so this is script-level learning, not corpus memorisation."
    - "The fine-tune is also ~2x faster: the base runs to the token cap emitting filler, the LoRA stops at end-of-line."
    - "Diacritics: base diac-F1 ~0.03 on KHATT, ~0.35 on NAKBA; LoRA reaches 0.35 / 0.69. Its diac-insensitive vs raw CER are close, so it is not just guessing skeletons."
    - "Open: how much of the gain is the OUTPUT FORMAT prior (line-only, no chat) vs. genuine visual grapheme learning? A prompt-only / format-only control run would separate them."
    - "Open: data-scaling — 8,000 lines was one arbitrary point. Re-run at 1k / 2k / 4k / full to trace where the held-out curve flattens; that sizes the moat for a from-scratch Arabic HTR effort."
    - "Open: unfreezing the ViT (train_vision: true) is the lever for degraded / historical script (RASAM Maghrebi, HistoricalBooks) where the frozen encoder may be the bottleneck."
