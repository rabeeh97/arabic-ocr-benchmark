# Pre-flight smoke for the paid Claude/GPT sweep. Two cheap models, one dataset,
# 2 lines -> ~4 billable calls, well under $0.01. Confirms the *_PAID keys work,
# tokens/cost come back populated, and the cache writes. Run before
# run.paid-apis.yaml.
models:
  - claude-haiku-paid
  - gpt-4o-mini-paid

datasets:
  - kitab_muharaf

limit: 2
offset: 0
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 1
max_retries: 3
cache: true
results_dir: results
