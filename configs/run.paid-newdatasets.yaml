# Paid models on the four newly-added KITAB-Bench subsets only (the printed /
# historical / online sets). rows 000000-000009 each (historicalbooks = its whole
# 10). line-v2. Excludes the GPT-5.6 reasoning trio (sol/terra/luna): they burn
# 2-4k hidden reasoning tokens per line and dominate cost for no accuracy gain.
models:
  - claude-haiku-paid
  - claude-sonnet-paid
  - claude-opus-paid
  - claude-fable-paid
  - claude-fable-5-1-paid
  - gpt-4o-mini-paid
  - gpt-4o-paid
  - gpt-4.1-paid
  - gpt-5-paid

datasets:
  - kitab_historicalbooks
  - kitab_hindawi
  - kitab_historyar
  - kitab_onlinekhatt

limit: 10
offset: 0
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 2
max_retries: 3
cache: true
results_dir: results
