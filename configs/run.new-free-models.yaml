# One-shot pass for the free-tier models added Sep 2026. Same datasets / limit /
# profiles as run.compare-hosted.yaml so the rows drop straight into the board.
# accumulate=true -> adds `limit` never-scored lines per model and retries
# anything that errored; re-run to grow n / finish rate-limited models.
#
# NVIDIA retired the hosted Nemotron-VL line (llama-3.1-nemotron-nano-vl-8b-v1
# and nemotron-nano-12b-v2-vl both 410 "end of life 2026-08-26"), so the NVIDIA
# rows here are the Llama-3.2-Vision / Gemma-4 NIM models that still answer.
models:
  - nvidia-llama-3.2-90b-vl
  - nvidia-llama-3.2-11b-vl
  - nvidia-gemma-4-31b
  - mistral-medium
  - openrouter-gemma-4-31b-free
  - openrouter-gemma-4-26b-free
  - openrouter-minimax-m3-free

datasets:
  - kitab_muharaf
  - muharaf_lines

limit: 10
accumulate: true
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 3
max_retries: 3
cache: true
results_dir: results
