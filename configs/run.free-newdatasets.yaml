# Free-tier hosted models on the two KITAB-Bench PRINTED subsets, added after the
# handwriting sets. historicalbooks = degraded historical print (only 10 rows -> the
# whole set). hindawi = clean digitised print (200 rows; first 20 here, grow with
# accumulate). No paid keys involved. line-v2 prompt, rows 000000+ .
#
# Model list mirrors run.compare-hosted.yaml's working free set. NVIDIA NIM rows
# are left out entirely: llama-3.2-vision is ~150 s/line + CER > 1, and
# nvidia-gemma-4-31b hangs indefinitely on the larger page images here.
models:
  - gemini-flash-lite
  - pixtral-12b
  - mistral-small
  - mistral-medium
  - openrouter-qwen2.5-vl-72b
  - openrouter-qwen3-vl-235b
  - openrouter-llama-4-maverick
  - openrouter-gemma-4-31b-free
  - openrouter-gemma-4-26b-free
  - openrouter-minimax-m3-free

datasets:
  - kitab_historicalbooks
  - kitab_hindawi
  - kitab_historyar
  - kitab_onlinekhatt

limit: 20
offset: 0
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 3
max_retries: 3
cache: true
results_dir: results
