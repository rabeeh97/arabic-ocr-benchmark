# Comparison pass: run the free-tier hosted models on the same first-10 lines of
# kitab_muharaf and muharaf_lines that the local open-weight models were already
# scored on, so the leaderboard's per-dataset tables compare hosted vs local on
# identical images. offset 0 + limit 10 == the local runs' slice; the per-line
# cache means a re-run costs nothing.
models:
  - gemini-flash
  - gemini-flash-lite
  - pixtral-12b
  - mistral-small
  - openrouter-qwen2.5-vl-72b
  - openrouter-qwen3-vl-235b
  - openrouter-llama-4-maverick

datasets:
  - kitab_muharaf
  - muharaf_lines

limit: 10
offset: 0
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 4
max_retries: 3
cache: true
results_dir: results
