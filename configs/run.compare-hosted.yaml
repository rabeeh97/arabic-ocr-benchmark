# Comparison pass: free-tier hosted models on the datasets the local open-weight
# models were scored on. accumulate=true -> each run adds `limit` brand-new
# (never-scored) lines per model and retries anything that errored last time;
# nothing already scored is recomputed. Re-run this to keep growing n.
#
# gemini-flash (3.6) is intentionally left out: on the free AI Studio tier it
# rate-limits hard (errors, not data) and costs ~6x gemini-flash-lite for worse
# output. gemini-flash-lite covers the Gemini line here.
models:
  - gemini-flash-lite
  - pixtral-12b
  - mistral-small
  - openrouter-qwen2.5-vl-72b
  - openrouter-qwen3-vl-235b
  - openrouter-llama-4-maverick

datasets:
  - kitab_muharaf
  - muharaf_lines

limit: 10
accumulate: true
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 4
max_retries: 3
cache: true
results_dir: results
