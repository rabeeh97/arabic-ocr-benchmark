# Dataset registry. See docs/datasets.md for access details.
# Each entry maps a name -> adapter module + parameters.

muharaf_lines:
  adapter: arabic_ocr_bench.datasets.muharaf_lines:MuharafLines
  hf_id: aamijar/muharaf-public
  track: line
  split: test              # the benchmark hold-out; train/validation reserved for fine-tuning
  license: CC-BY-NC-SA-4.0
  source: https://huggingface.co/datasets/aamijar/muharaf-public
  card: >-
    Muharaf ("Manuscripts of Handwritten Arabic", NeurIPS 2024), line-level split.
    Real 19th-to-21st-century handwritten letters, diaries and records —
    predominantly Ruq'ah script, often degraded, with natural diacritic use. This
    is the held-out `test` split (1,334 lines); train/validation are reserved for
    fine-tuning. CC-BY-NC-SA-4.0, research use.

# --- KITAB-Bench text-recognition subsets (arXiv:2502.14949) --------------------
# Ungated HF datasets (ahmedheakl/arocrbench_*), single `train` split, small
# (200-500 lines each). One shared adapter; `params.subset` picks the HF repo.
# These are the priority datasets — small, quick, and cover handwritten +
# historical + printed Arabic.
kitab_khatt:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_khatt }
  track: line
  split: train
  license: see KHATT terms (research use)
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_khatt
  card: >-
    KITAB-Bench / KHATT subset — modern handwritten Arabic, line images with
    clean printed-quality ground truth. The main handwriting target: cleaner and
    more uniform than Muharaf, so a useful contrast with it.
kitab_muharaf:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_muharaf }
  track: line
  split: train
  # Repackaged from the same underlying Muharaf letters as `muharaf_lines`
  # under a *different* HF repo id, so `check_source_not_scored()`'s exact
  # (hf_id, split) match can't see the overlap with the `muharaf_train`
  # training source. `safe_eval_datasets()` (training/data.py) reads this
  # field to drop it from any sweep for a model trained on Muharaf.
  overlaps_source: aamijar/muharaf-public
  license: CC-BY-NC-SA-4.0
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_muharaf
  card: >-
    KITAB-Bench / Muharaf subset — historical handwritten Arabic segments (a
    small slice of the same Muharaf corpus as `muharaf_lines`), for a direct
    KITAB-Bench-scored comparison point. Excluded from any benchmark sweep for
    a model trained on Muharaf — see `overlaps_source` above.
kitab_historicalbooks:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_historicalbooks }
  track: line
  split: train
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_historicalbooks
  card: >-
    KITAB-Bench / historical printed books — degraded historical *printed*
    Arabic. Harder than modern print, easier than handwriting.
kitab_hindawi:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_hindawi }
  track: line
  split: train
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_hindawi
  card: >-
    KITAB-Bench / Hindawi — clean digitised printed books. An easy printed-Arabic
    anchor: strong models should approach 0 % CER here.
kitab_historyar:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_historyar }
  track: line
  split: train
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_historyar
  card: >-
    KITAB-Bench / HistoryAr — historical Arabic manuscripts and documents. Old
    scripts, degraded scans; a hard historical-handwriting target.
kitab_onlinekhatt:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_onlinekhatt }
  track: line
  split: train
  license: see KHATT / KITAB-Bench terms (research use)
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_onlinekhatt
  card: >-
    KITAB-Bench / OnlineKHATT — the online (stylus-captured) KHATT handwriting
    set, rendered to line images. Cleaner strokes than scanned handwriting.

# --- NAKBA NLP 2026 — Omar Al-Saleh manuscript collection (Systems Track) ------
# Shared task: https://acrps.ai/nakba-nlp-manu-understanding-2026
# GATED (auto-approve): open https://huggingface.co/datasets/U4RASD/omar-al-saleh-manuscripts-segments
# while logged in and click "Agree and access repository" once — then the same
# HF_TOKEN used everywhere else can stream it. The `-full` (page-level) repo is
# manual-approval and not wired here.
nakba_lines:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: U4RASD/omar-al-saleh-manuscripts-segments }
  track: line
  split: test               # also has train/ (fine-tuning) and blind_test/ (no GT)
  license: CC-BY-4.0
  source: https://huggingface.co/datasets/U4RASD/omar-al-saleh-manuscripts-segments
  card: >-
    NAKBA NLP 2026 — line segments from the Omar Al-Saleh memoirs (16 handwritten
    Arabic documents, 1951-1965; the full collection is ~1.6M words / 6,395 pages)
    from the Palestinian Nakba oral-history archive. Real degraded 20th-century
    handwriting with a curated line-level transcription (`image` + `text`).
    CC-BY-4.0; the `test` split of the shared task's Systems Track.

# --- RASAM (Calfa / BULAC) — Maghribi-script historical manuscripts ------------
# HF, ungated, apache-2.0. Same `KitabBench` generic adapter: columns are
# `image` + `transcription`. A distinct script family (Maghrebi) from the
# Ruq'ah / Naskh handwriting elsewhere in the suite — worth its own rows.
rasam2:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: calfa-ai/RASAM-2 }
  track: line
  split: test               # 372 lines (train 2,976 / val 372 reserved)
  license: apache-2.0
  source: https://huggingface.co/datasets/calfa-ai/RASAM-2
  card: >-
    RASAM 2 — line crops from Maghrebi-script Arabic manuscripts (BULAC
    collection), transcribed by the Calfa / RASAM project. Dense diacritics,
    a script style under-represented in most Arabic HTR sets.
rasam1:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: calfa-ai/RASAM-1 }
  track: line
  split: test               # 734 lines (train 5,864 / val 733 reserved)
  license: apache-2.0
  source: https://huggingface.co/datasets/calfa-ai/RASAM-1
  card: >-
    RASAM 1 — the earlier Maghrebi-script manuscript set from the same project;
    a larger companion to rasam2 for the same script family.

# --- extra KITAB-Bench text-recognition subsets (same adapter as kitab_*) ------
# All ahmedheakl/arocrbench_*, ungated, one `train` split, small. Mostly
# PRINTED Arabic of varying quality — extends coverage beyond handwriting.
kitab_adab:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_adab }
  track: line
  split: train              # 200
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_adab
  card: >-
    KITAB-Bench / adab — short printed Arabic segments (literary corpus). Clean
    print; an easy-to-mid anchor.
kitab_patsocr:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_patsocr }
  track: line
  split: train              # 500
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_patsocr
  card: >-
    KITAB-Bench / PATS-OCR — printed Arabic pages (PATS corpus), longer lines
    with classical religious text. Ground truth in the `answer` column.
kitab_isippt:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_isippt }
  track: line
  split: train              # 500
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_isippt
  card: >-
    KITAB-Bench / ISI-PPT — printed Arabic from presentation slides; varied
    fonts and layouts.
kitab_evarest:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_evarest }
  track: line
  split: train              # 800
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_evarest
  card: >-
    KITAB-Bench / EvArEST — Arabic scene text / short words in the wild;
    photographed signage-style text, a harder printed setting.
kitab_arabicocr:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_arabicocr }
  track: line
  split: train              # 50 (tiny)
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_arabicocr
  card: >-
    KITAB-Bench / ArabicOCR — a small 50-line printed-Arabic set; too small to
    weigh heavily, kept for completeness.

# --- AraMS-28k-HTR (Zenodo 10.5281/zenodo.21499649) ----------------------------
# ~27,971 real, pre-segmented handwritten-manuscript line crops. Not an HF
# dataset — `scripts/fetch_arams.py` downloads + extracts it to `params.root`
# (default `data/arams_28k_htr/`, not run automatically; see the fetch script).
# No official split ships with the corpus; the adapter carves its own
# deterministic train/test split (see `datasets/arams.py`) — `params.root`
# must point at the SAME directory from any training config's matching
# `data.sources` entry (split: train) so the two splits stay disjoint.
arams_htr:
  adapter: arabic_ocr_bench.datasets.arams:AraMSHTR
  params: { root: data/arams_28k_htr }
  track: line
  split: test              # ~1,800 lines reserved; remainder is the `train` split
  license: see Zenodo record 10.5281/zenodo.21499649
  source: https://zenodo.org/records/21499649
  card: >-
    AraMS-28k-HTR — ~27,971 real historical-manuscript lines, pre-segmented
    (Kraken-style) line crops, a genuinely different corpus from Muharaf/NAKBA.
    This is the ~1,800-line held-out `test` slice; the remainder is reserved
    for fine-tuning.

synthetic:
  adapter: arabic_ocr_bench.datasets.synthetic:Synthetic
  track: line
  split: test
  license: n/a
  source: in-repo (offline pipeline check — no network)
  card: >-
    Ten hard-coded Arabic sentences rendered to plain images, shipped in the repo.
    Not a benchmark — an offline check that the runner, scorer and leaderboard work
    end to end without any download.

