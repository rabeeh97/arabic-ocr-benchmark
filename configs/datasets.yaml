# Dataset registry. See docs/datasets.md for access details.
# Each entry maps a name -> adapter module + parameters.

muharaf_lines:
  adapter: arabic_ocr_bench.datasets.muharaf_lines:MuharafLines
  hf_id: aamijar/muharaf-public
  track: line
  split: test              # the benchmark hold-out; train/validation reserved for fine-tuning
  license: CC-BY-NC-SA-4.0
  source: https://huggingface.co/datasets/aamijar/muharaf-public
  card: >-
    Muharaf ("Manuscripts of Handwritten Arabic", NeurIPS 2024), line-level split.
    Real 19th-to-21st-century handwritten letters, diaries and records —
    predominantly Ruq'ah script, often degraded, with natural diacritic use. This
    is the held-out `test` split (1,334 lines); train/validation are reserved for
    fine-tuning. CC-BY-NC-SA-4.0, research use.

# --- KITAB-Bench text-recognition subsets (arXiv:2502.14949) --------------------
# Ungated HF datasets (ahmedheakl/arocrbench_*), single `train` split, small
# (200-500 lines each). One shared adapter; `params.subset` picks the HF repo.
# These are the priority datasets — small, quick, and cover handwritten +
# historical + printed Arabic.
kitab_khatt:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_khatt }
  track: line
  split: train
  license: see KHATT terms (research use)
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_khatt
  card: >-
    KITAB-Bench / KHATT subset — modern handwritten Arabic, line images with
    clean printed-quality ground truth. The main handwriting target: cleaner and
    more uniform than Muharaf, so a useful contrast with it.
kitab_muharaf:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_muharaf }
  track: line
  split: train
  license: CC-BY-NC-SA-4.0
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_muharaf
  card: >-
    KITAB-Bench / Muharaf subset — historical handwritten Arabic segments (a
    small slice of the same Muharaf corpus as `muharaf_lines`), for a direct
    KITAB-Bench-scored comparison point.
kitab_historicalbooks:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_historicalbooks }
  track: line
  split: train
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_historicalbooks
  card: >-
    KITAB-Bench / historical printed books — degraded historical *printed*
    Arabic. Harder than modern print, easier than handwriting.
kitab_hindawi:
  adapter: arabic_ocr_bench.datasets.kitab_bench:KitabBench
  params: { subset: arocrbench_hindawi }
  track: line
  split: train
  license: see KITAB-Bench paper
  source: https://huggingface.co/datasets/ahmedheakl/arocrbench_hindawi
  card: >-
    KITAB-Bench / Hindawi — clean digitised printed books. An easy printed-Arabic
    anchor: strong models should approach 0 % CER here.

synthetic:
  adapter: arabic_ocr_bench.datasets.synthetic:Synthetic
  track: line
  split: test
  license: n/a
  source: in-repo (offline pipeline check — no network)
  card: >-
    Ten hard-coded Arabic sentences rendered to plain images, shipped in the repo.
    Not a benchmark — an offline check that the runner, scorer and leaderboard work
    end to end without any download.

