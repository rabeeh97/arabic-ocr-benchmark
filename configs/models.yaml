# Model registry. See docs/models.md for access details and quirks.
#
# client:
#   mock       -> deterministic, zero-cost; pipeline sanity checks
#   litellm    -> hosted APIs (or any OpenAI-compatible server via api_base)
#   hf_local   -> local open-weight / Arabic-specific weights (needs the `local` extra)
#   paddleocr  -> PaddleOCR's own recognition model (PaddlePaddle, not PyTorch —
#                 needs the `paddleocr` extra, a completely separate install from
#                 everything else here; see docs/experiments/paddleocr-runbook.md)
#
# `card` is a 1-3 sentence description shown on the leaderboard page.
# A model being defined here costs nothing; it is only exercised when a run
# config lists its name. pricing is USD; report.py uses it to compute cost.

# --- pipeline sanity models -------------------------------------------------
mock_echo:
  client: mock
  mode: echo_gt            # returns the ground truth  -> CER 0.0 ceiling
  pricing: null
  card: >-
    Not a model — a test stub that returns the ground truth verbatim. Its row is
    the pipeline's upper bound (CER 0%); if it isn't zero, scoring is broken.
mock_empty:
  client: mock
  mode: empty              # returns ""                -> CER ~1.0 floor
  pricing: null
  card: >-
    Test stub that returns an empty string. Its row is the pipeline's lower bound
    (CER ~100%); a "predict nothing" baseline every real model must beat.

# --- hosted VLMs (LiteLLM) ----------------------------------------------------
# All go through litellm_client. Fields: litellm_id, env_key (skipped if unset),
# optional api_base / api_base_env, params, pricing (USD/1M, for cost estimate),
# optional max_tokens. run_hosted.py / notebook 02 run every one whose key is set.
# Pricing marked (verify) is a best-effort estimate — check the provider's page.

# Google — Gemini 3.x (2.5-series is closed to new API keys as of 2026).
gemini-flash:
  client: litellm
  litellm_id: gemini/gemini-3.6-flash
  env_key: GEMINI_API_KEY          # single-key fallback (Colab)
  # Multi-key pool: each present key is throttled to per_key_rpm on its own
  # sliding window; requests rotate across keys and route around any that is
  # 429-ing (rested 60 s) or daily-capped (dropped for the run).
  env_keys: [GEMINI1_API_KEY, GEMINI2_API_KEY, GEMINI3_API_KEY]
  per_key_rpm: 14                  # stay under the 15 req/min free-tier cap per key
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.55, output_usd_per_1m: 8.00 }   # confirmed 2026-09 (standard rate effective 2027-01-01: $1.50/$7.50; promo through end-2026 is lower), rounded up for safety margin
  card: >-
    Google's fast multimodal model (Gemini 3.6 Flash). General-purpose
    vision-language, not OCR-tuned; strong at reading printed and clear
    handwritten text. Free AI Studio tier.
gemini-flash-lite:
  client: litellm
  litellm_id: gemini/gemini-3.5-flash-lite
  env_key: GEMINI_API_KEY          # single-key fallback (Colab)
  env_keys: [GEMINI1_API_KEY, GEMINI2_API_KEY, GEMINI3_API_KEY]
  per_key_rpm: 14
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.35, output_usd_per_1m: 3.00 }   # confirmed 2026-09: $0.30/$2.50, rounded up for safety margin
  card: >-
    Google's cheapest/fastest Gemini (3.5 Flash-Lite). Low-cost baseline row.
gemini-flash-lite-640tok:
  # Same model/keys/pool as gemini-flash-lite, just with room to answer beyond
  # one short line — for page-v2 (prompt-sensitivity study) on the paragraph
  # /page-scale kitab_hindawi / kitab_historicalbooks subsets, which the
  # default 256-token cap would truncate. Separate row so it doesn't touch the
  # gemini-flash-lite config other runs (incl. the resumable full crawl) use.
  client: litellm
  litellm_id: gemini/gemini-3.5-flash-lite
  env_key: GEMINI_API_KEY
  env_keys: [GEMINI1_API_KEY, GEMINI2_API_KEY, GEMINI3_API_KEY]
  per_key_rpm: 14
  params: { temperature: 0 }
  max_tokens: 640
  pricing: { input_usd_per_1m: 0.35, output_usd_per_1m: 3.00 }   # confirmed 2026-09: $0.30/$2.50, rounded up for safety margin
  card: >-
    gemini-flash-lite at 640 max_tokens — for the page-v2 prompt-sensitivity
    variant on paragraph/page-scale datasets only.
gemini-pro:
  client: litellm
  litellm_id: gemini/gemini-3.1-pro-preview
  env_key: GEMINI_API_KEY          # single-key fallback (Colab)
  env_keys: [GEMINI1_API_KEY, GEMINI2_API_KEY, GEMINI3_API_KEY]
  per_key_rpm: 14
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 2.05, output_usd_per_1m: 12.50 }   # confirmed 2026-09: $2.00/$12.00 (<=200K token prompts), rounded up for safety margin
  card: >-
    Google's larger multimodal model (Gemini 3.1 Pro) — slower and pricier than
    Flash, generally more accurate on hard images. General-purpose, not
    OCR-specialised.

