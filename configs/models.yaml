# Model registry. See docs/models.md for access details and quirks.
#
# client:
#   mock      -> deterministic, zero-cost; pipeline sanity checks
#   litellm   -> hosted APIs (or any OpenAI-compatible server via api_base)
#   hf_local  -> local open-weight / Arabic-specific weights (needs the `local` extra)
#
# `card` is a 1-3 sentence description shown on the leaderboard page.
# A model being defined here costs nothing; it is only exercised when a run
# config lists its name. pricing is USD; report.py uses it to compute cost.

# --- pipeline sanity models -------------------------------------------------
mock_echo:
  client: mock
  mode: echo_gt            # returns the ground truth  -> CER 0.0 ceiling
  pricing: null
  card: >-
    Not a model — a test stub that returns the ground truth verbatim. Its row is
    the pipeline's upper bound (CER 0%); if it isn't zero, scoring is broken.
mock_empty:
  client: mock
  mode: empty              # returns ""                -> CER ~1.0 floor
  pricing: null
  card: >-
    Test stub that returns an empty string. Its row is the pipeline's lower bound
    (CER ~100%); a "predict nothing" baseline every real model must beat.

# --- hosted VLMs (LiteLLM) ----------------------------------------------------
# All go through litellm_client. Fields: litellm_id, env_key (skipped if unset),
# optional api_base / api_base_env, params, pricing (USD/1M, for cost estimate),
# optional max_tokens. run_hosted.py / notebook 02 run every one whose key is set.
# Pricing marked (verify) is a best-effort estimate — check the provider's page.

# Google — Gemini 3.x (2.5-series is closed to new API keys as of 2026).
gemini-flash:
  client: litellm
  litellm_id: gemini/gemini-3.6-flash
  env_key: GEMINI_API_KEY          # Google AI Studio free tier works (rate-limited)
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.30, output_usd_per_1m: 2.50 }   # (verify)
  card: >-
    Google's fast multimodal model (Gemini 3.6 Flash). General-purpose
    vision-language, not OCR-tuned; strong at reading printed and clear
    handwritten text. Free AI Studio tier.
gemini-flash-lite:
  client: litellm
  litellm_id: gemini/gemini-3.5-flash-lite
  env_key: GEMINI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.10, output_usd_per_1m: 0.40 }   # (verify)
  card: >-
    Google's cheapest/fastest Gemini (3.5 Flash-Lite). Low-cost baseline row.
gemini-pro:
  client: litellm
  litellm_id: gemini/gemini-3.1-pro-preview
  env_key: GEMINI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.25, output_usd_per_1m: 10.00 }   # (verify)
  card: >-
    Google's larger multimodal model (Gemini 3.1 Pro) — slower and pricier than
    Flash, generally more accurate on hard images. General-purpose, not
    OCR-specialised.

