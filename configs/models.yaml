  client: litellm
  litellm_id: openai/gpt-5.6-terra
  env_key: OPENAI_API_KEY_PAID
  params: { reasoning_effort: none }             # was "minimal" (honoured, but "none" is lower still) — probing it
  max_tokens: 4000
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 12.00 }
  card: >-
    OpenAI GPT-5.6 "terra" on the paid key — the mid GPT-5.6 tier. Reasoning
