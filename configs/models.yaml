gpt-4o-paid:
  client: litellm
  litellm_id: openai/gpt-4o
  env_key: OPENAI_API_KEY_PAID
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 2.50, output_usd_per_1m: 10.00 }
  card: >-
    OpenAI GPT-4o on the paid key. Strong general vision-language reasoning; no
