# NVIDIA — build.nvidia.com / NIM API catalog. OpenAI-compatible endpoint at
# https://integrate.api.nvidia.com/v1; one NVIDIA_API_KEY, free developer tier
# (rate-limited, ~1k credits, no card). litellm can't infer the key for a custom
# api_base, so the registry passes it explicitly from env_key (same path as the
# Ollama-cloud rows).
#
# NOTE (verified 2026-09-02 against GET /v1/models): NVIDIA has RETIRED the whole
# hosted Nemotron-VL line — `nvidia/llama-3.1-nemotron-nano-vl-8b-v1` and
# `nvidia/nemotron-nano-12b-v2-vl` both 410 "end of life 2026-08-26", and
# `google/gemma-3-27b-it` 410'd on 2026-05-12. Do not re-add them here; the live
# chat VLMs on the catalog are Meta Llama-3.2-Vision (11B/90B), Gemma 3 4B/12B,
# Gemma 4 31B, Phi-3-vision and nemotron-3-nano-omni. The rows below are the
# ones that actually answer.
nvidia-llama-3.2-90b-vl:
  client: litellm
  litellm_id: openai/meta/llama-3.2-90b-vision-instruct
  env_key: NVIDIA_API_KEY
  api_base: https://integrate.api.nvidia.com/v1
  params: { temperature: 0 }
  pricing: null                    # free NIM tier
  card: >-
    Meta's Llama 3.2 90B Vision, served on NVIDIA's NIM catalog. A large
    general-purpose VLM (visual recognition + image reasoning), not OCR-tuned;
    on bare handwritten line crops it tends to describe rather than transcribe.
nvidia-llama-3.2-11b-vl:
  client: litellm
  litellm_id: openai/meta/llama-3.2-11b-vision-instruct
  env_key: NVIDIA_API_KEY
  api_base: https://integrate.api.nvidia.com/v1
  params: { temperature: 0 }
  pricing: null                    # free NIM tier
  card: >-
    Meta's Llama 3.2 11B Vision on NVIDIA's NIM catalog — the small sibling of
    the 90B row. General-purpose, not OCR-tuned; on the Sep 2026 pass it went
    into repetition collapse on Arabic handwriting (CER > 300%), i.e. it can't
    read the script at all rather than reading it badly.
nvidia-gemma-4-31b:
  client: litellm
  litellm_id: openai/google/gemma-4-31b-it
  env_key: NVIDIA_API_KEY
  api_base: https://integrate.api.nvidia.com/v1
  params: { temperature: 0 }
  pricing: null                    # free NIM tier
  card: >-
    Google's Gemma 4 31B (multimodal) on NVIDIA's NIM catalog — current-gen open
    VLM, replaces the retired Gemma 3 27B row. General-purpose, not Arabic-tuned.
# Reasoning model: chain-of-thought lands in a separate `reasoning_content`
# field (not `content`), but bump max_tokens so the answer isn't token-starved.
# WARNING (2026-09-03): a tiny synthetic image transcribes fine in seconds, but
# on real Muharaf line crops the NVIDIA endpoint never responds — a run of this
# model sat at 0/10 for ~2h. Not wired into any run config for that reason;
# needs debugging (smaller image cap? different endpoint?) before use.
nemotron-omni:
  client: litellm
  litellm_id: openai/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  env_key: NVIDIA_API_KEY
  api_base: https://integrate.api.nvidia.com/v1
  params: { temperature: 0 }
  max_tokens: 1024
  pricing: null                    # free NIM tier
  card: >-
    NVIDIA's Nemotron 3 Nano Omni (30B, A3B MoE) — the one Nemotron multimodal
    model still live on the NIM catalog after the Nemotron-VL line was retired.
    A reasoning model: it thinks in a separate field and returns a clean
    transcription in `content`. General-purpose, not Arabic-tuned; slower and
    more tokens per line than a plain VLM.

# Ollama — OpenAI-compatible endpoint; set OLLAMA_API_BASE + OLLAMA_API_KEY.
# NOTE: as of 2026 the Ollama *cloud* (https://ollama.com/v1) serves only text
# LLMs — NO vision models. These entries only work against a LOCAL Ollama:
#     ollama serve
#     ollama pull qwen2.5vl:3b        # ~3.2 GB, best small Arabic-capable VLM
#     ollama pull qwen2.5vl:7b        # ~6 GB, clearly better if the box allows
#     ollama pull minicpm-v           # ~5.5 GB, 8B, explicitly multilingual OCR
# then in .env:  OLLAMA_API_BASE=http://localhost:11434/v1  (OLLAMA_API_KEY=ollama)
# Uncomment the rows for whatever you pulled. Left commented so the hosted sweep
# doesn't try (and fail) them while OLLAMA_API_BASE still points at the cloud.
# Avoid llava / bakllava / moondream / granite-vision here — weak on Arabic.
# ollama-qwen2.5vl-3b:
#   client: litellm
#   litellm_id: openai/qwen2.5vl:3b
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     Qwen2.5-VL 3B via a local Ollama. Smallest model with genuine Arabic OCR
#     ability — same family that leads the hosted board at 72B/235B.
# ollama-qwen2.5vl-7b:
#   client: litellm
#   litellm_id: openai/qwen2.5vl:7b
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     Qwen2.5-VL 7B via a local Ollama. Noticeably stronger than the 3B; the
#     practical local OCR pick when there's ~8 GB of RAM/VRAM to spare.
# ollama-minicpm-v:
#   client: litellm
#   litellm_id: openai/minicpm-v
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     MiniCPM-V 8B via a local Ollama. Multilingual document OCR (30+ languages
#     incl. Arabic); a useful non-Qwen small-model comparison point.
claude-haiku:
  client: litellm
  litellm_id: anthropic/claude-haiku-4-5
  env_key: ANTHROPIC_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.00, output_usd_per_1m: 5.00 }
  card: >-
    Anthropic's small, fast model (Haiku 4.5). Cheapest of the Claude tier;
    general-purpose, not OCR-specialised.
claude-sonnet:
  client: litellm
  litellm_id: anthropic/claude-sonnet-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Sonnet 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 10.00 }
  card: >-
    Anthropic's mid-tier model (Sonnet 5). Careful transcriber that tends to
    preserve diacritics well; general-purpose, not OCR-specialised.
claude-opus:
  client: litellm
  litellm_id: anthropic/claude-opus-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Opus 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 5.00, output_usd_per_1m: 25.00 }
  card: >-
    Anthropic's most capable widely-released model (Opus 5). Strongest general
    vision-language reasoning in the set; no Arabic-specific tuning. Priciest.

# --- PAID hosted APIs (deliberate spend) -----------------------------------------
# These rows are pinned to the *_PAID keys (OPENAI_API_KEY_PAID /
# ANTHROPIC_API_KEY_PAID) so a benchmark run bills the paid accounts and never
# the free/trial keys that may also be in .env. registry.build_model passes the
# env_key value to litellm explicitly, so litellm's provider-default lookup
# (OPENAI_API_KEY / ANTHROPIC_API_KEY) is bypassed. Pricing verified against the
# providers' pricing pages 2026-09 (USD per 1M tokens). Kept as separate rows
# (not repointing the claude-*/gpt-* rows above) so the leaderboard names make
# the paid vs free/trial distinction obvious. Larger max_tokens on the
# thinking/reasoning models (Opus 5, Sonnet 5, Fable 5/5.1, GPT-5, GPT-5.6) so a
# short transcription isn't truncated by reasoning tokens; those reasoning tokens
# are billed as output and are part of the measured cost.

# Anthropic (ANTHROPIC_API_KEY_PAID)
claude-haiku-paid:
  client: litellm
  litellm_id: anthropic/claude-haiku-4-5
  env_key: ANTHROPIC_API_KEY_PAID
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.00, output_usd_per_1m: 5.00 }
  card: >-
    Anthropic Claude Haiku 4.5 on the paid key. Cheapest Claude tier; fast,
    general-purpose, not OCR-specialised.
claude-sonnet-paid:
  client: litellm
  litellm_id: anthropic/claude-sonnet-5
  env_key: ANTHROPIC_API_KEY_PAID
  params: {}                                   # Sonnet 5 rejects temperature/top_p
  max_tokens: 4000                             # adaptive thinking on by default
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 10.00 }
  card: >-
    Anthropic Claude Sonnet 5 on the paid key. Careful transcriber, tends to
    preserve diacritics; adaptive thinking is on by default.
claude-opus-paid:
  client: litellm
  litellm_id: anthropic/claude-opus-5
  env_key: ANTHROPIC_API_KEY_PAID
  params: {}                                   # Opus 5 rejects temperature/top_p
  max_tokens: 4000                             # adaptive thinking on by default
  pricing: { input_usd_per_1m: 5.00, output_usd_per_1m: 25.00 }
  card: >-
    Anthropic Claude Opus 5 on the paid key. Strongest general vision-language
    reasoning in the set; no Arabic tuning.
claude-fable-paid:
  client: litellm
  litellm_id: anthropic/claude-fable-5
  env_key: ANTHROPIC_API_KEY_PAID
  params: {}                                   # Fable 5 rejects temperature/top_p
  max_tokens: 4000                             # thinking always on (billed as output)
  pricing: { input_usd_per_1m: 10.00, output_usd_per_1m: 50.00 }
  card: >-
    Anthropic Claude Fable 5 on the paid key — the flagship above Opus 5.
    Thinking is always on, so it is slower and spends output tokens on reasoning;
    included as an accuracy ceiling, not a practical OCR pick.
claude-fable-5-1-paid:
  client: litellm
  litellm_id: anthropic/claude-fable-5-1
  env_key: ANTHROPIC_API_KEY_PAID
  params: {}
  max_tokens: 4000
  pricing: { input_usd_per_1m: 10.00, output_usd_per_1m: 50.00 }
  card: >-
    Anthropic Claude Fable 5.1 on the paid key. Same price and always-on thinking
    as Fable 5; the current top flagship revision.

# OpenAI (OPENAI_API_KEY_PAID)
gpt-4o-mini-paid:
  client: litellm
  litellm_id: openai/gpt-4o-mini
  env_key: OPENAI_API_KEY_PAID
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.15, output_usd_per_1m: 0.60 }
  card: >-
    OpenAI GPT-4o mini on the paid key. Cheap vision baseline; weaker on
