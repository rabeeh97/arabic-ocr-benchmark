sherif-arabic-htr-v3:
  # The public Arabic-English HTR model the Ketaba team adapted — a strong
  # dedicated Arabic handwriting model in its own right (Qwen2.5-VL-3B fine-tuned
  # on Muharaf). Its row is the "un-adapted base" comparison for nakba-ketaba-ocr.
  client: hf_local
  hf_id: sherif1313/Arabic-English-handwritten-OCR-v3
  arch: qwen2_5_vl
  min_ram_gb: 12
  dtype: bfloat16
  pricing: null
  card: >-
    sherif1313's Arabic-English handwritten-OCR v3 — Qwen2.5-VL-3B fine-tuned for
    Arabic/English handwriting on Muharaf. Widely used as a base for NAKBA 2026
    entries (it is the Ketaba-OCR backbone); shown here un-adapted. Apache-2.0.
nakba-warraq-fanar:
  # Al-Warraq (NAKBA 2026 Systems Track, 5th place, corpus CER ~0.114). A QLoRA
  # adapter (r=16) on QCRI's Fanar-2-Oryx-IVU, which is itself a Qwen2.5-VL-7B
  # fine-tune -> 4-bit on a T4. Apache-2.0.
  client: hf_local
  hf_id: QCRI/Fanar-2-Oryx-IVU
  adapter_id: mabdulaziz499/Warraq-Arabic-HTR-7B
  arch: qwen2_5_vl
  min_ram_gb: 22
  dtype: bfloat16
  load_in_4bit: true
  pricing: null
  card: >-
    Al-Warraq's NAKBA NLP 2026 HTR system — a QLoRA fine-tune of QCRI's
    Fanar-2-Oryx-IVU (Arabic-first Qwen2.5-VL-7B) on KHATT + OnlineKHATT +
    Muharaf. Placed 5th in the shared task (corpus CER ~0.114); its card also
    reports 0.039 CER on KHATT test. Run 4-bit.
fanar-oryx-7b:
  # The Warraq base on its own — QCRI's Arabic-first VLM (Qwen2.5-VL-7B FT).
  client: hf_local
  hf_id: QCRI/Fanar-2-Oryx-IVU
  arch: qwen2_5_vl
  min_ram_gb: 22
  dtype: bfloat16
  load_in_4bit: true
  pricing: null
  card: >-
    Fanar-2-Oryx-IVU (QCRI) — an Arabic-first vision-language model fine-tuned
    from Qwen2.5-VL-7B for culturally-aware image understanding. Not OCR-tuned;
    the un-adapted base of nakba-warraq-fanar. Run 4-bit.
fanar-oryx-7b-bf16:
  # bf16 (not 4-bit) sibling of fanar-oryx-7b — the same-precision base row for
  # the suite-v1-fanar2-oryx fine-tune. Registered by scripts/run_3090_benchmark.py.
  # Fine-tuning/redistribution license unconfirmed as of 2026-09-16 — see
  # scripts/_experiment_bases.py's `license_check` gate before actually running
  # this experiment slot.
  client: hf_local
  hf_id: QCRI/Fanar-2-Oryx-IVU
  arch: qwen2_5_vl
  min_ram_gb: 22
  dtype: bfloat16
  pricing: null
  card: >-
    Fanar-2-Oryx-IVU (QCRI) at bf16 — the untuned, same-precision baseline for
    the suite_v1 fine-tune on the combined Muharaf+AraMS+RASAM mix.
# NOT addable: factlogic/phoenix-arabic-manuscript-htr is a Kraken (CTC) model,
# not a HF-transformers model — it needs the `kraken` runtime, a different
# inference path — and is CC-BY-NC-SA. Strong on historical Arabic manuscripts
# (incl. an Omar Al-Saleh held-out eval) but out of scope for this client.
paligemma-arabic-hw:
  client: hf_local
  hf_id: google/paligemma-3b-pt-448           # gated base
  adapter_id: Nada2125/paligemma-3b-arabic-handwritten-ocr-1
  arch: paligemma
  min_ram_gb: 10       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: bfloat16
  pricing: null
  card: >-
    A community LoRA adapter for Arabic handwritten OCR on Google's PaliGemma-3B
    (gated). Trained on single handwritten lines — line-track only, not pages.
trocr-large-arabic:
  client: hf_local
  hf_id: David-Magdy/TR_OCR_LARGE
  arch: trocr
  min_ram_gb: 4       # CPU: skip (don't OOM-kill) if less free RAM
  max_new_tokens: 96
  pricing: null
  card: >-
    TrOCR-Large (0.6B, vision-encoder-decoder) finetuned for Arabic + English
    handwriting on KHATT and IAM. A dedicated HTR model rather than a general
    VLM — no prompt, single-line only. Runs on CPU/MPS; expect it to do best on
    KHATT-like lines and worse on out-of-distribution scripts (e.g. Muharaf).
minicpm-v:
  # custom model.chat() API (trust_remote_code); 4-bit on a T4, dropped in CPU mode.
  # Needs: pip install bitsandbytes
  client: hf_local
  hf_id: openbmb/MiniCPM-V-2_6
  arch: minicpmv
  min_ram_gb: 22       # CPU: skip (don't OOM-kill) if less free RAM
  load_in_4bit: true
  max_new_tokens: 160
  pricing: null
  card: >-
    MiniCPM-V 2.6 (8B), a compact multimodal model with multilingual document
    OCR across 30+ languages including Arabic. The strongest non-Qwen small VLM
    in the set; also the one to run locally via Ollama (`ollama pull minicpm-v`).

arabic-paddleocr-v5:
  # PaddlePaddle, not PyTorch — a dedicated 5M-param recognition model, not a
  # VLM (no prompt/chat; `prompt` is accepted and ignored by the client to
  # satisfy the ModelClient protocol). CAVEAT (2026-09 research pass, see
  # docs/experiments/paddleocr-runbook.md): this is actually a SHARED
  # Perso-Arabic-script model (Arabic+Persian+Uyghur+Urdu+Pashto+Kurdish+
  # Sindhi+Balochi+English together), trained on ~2,676 images total across
  # all 8 languages — tiny next to Muharaf/AraMS/RASAM. Harakat/diacritic
  # support is UNCONFIRMED and plausibly weak; test on real lines before
  # trusting the "Arabic" label. Needs the separate `paddleocr` extra (not
  # installed by default) — see the runbook for the exact install command
  # and a known Windows DLL-loading gotcha to check for on this specific box.
  client: paddleocr
  model_name: arabic_PP-OCRv5_mobile_rec
  # Confirmed on hardware 2026-09-17: this model emits RTL text in raw LTR
  # pixel order — reverse_output undoes that. See paddleocr_client.py's
  # docstring before changing this for a different model/version.
  reverse_output: true
  # Leave `device` unset so the launcher can pin CPU via PADDLEOCR_DEVICE
  # (needed while a VLM training run owns the GPU).
  pricing: null
  card: >-
    Baidu's PP-OCRv5 recognition model (mobile/5M-param variant), Arabic-script
    configuration. Shares its dictionary/training data with 7 other
    Perso-Arabic-script languages (~2,676 images total) — a fast, lightweight
    baseline, not a deep Arabic-specialist. Confirmed weak on diacritized text
    in our own testing; see docs/experiments/paddleocr-runbook.md.
