# Model registry. See docs/models.md for access details and quirks.
#
# client:
#   mock      -> deterministic, zero-cost; pipeline sanity checks
#   litellm   -> hosted APIs (or any OpenAI-compatible server via api_base)
#   hf_local  -> local open-weight / Arabic-specific weights (needs the `local` extra)
#
# `card` is a 1-3 sentence description shown on the leaderboard page.
# A model being defined here costs nothing; it is only exercised when a run
# config lists its name. pricing is USD; report.py uses it to compute cost.

# --- pipeline sanity models -------------------------------------------------
mock_echo:
  client: mock
  mode: echo_gt            # returns the ground truth  -> CER 0.0 ceiling
  pricing: null
  card: >-
    Not a model — a test stub that returns the ground truth verbatim. Its row is
    the pipeline's upper bound (CER 0%); if it isn't zero, scoring is broken.
mock_empty:
  client: mock
  mode: empty              # returns ""                -> CER ~1.0 floor
  pricing: null
  card: >-
    Test stub that returns an empty string. Its row is the pipeline's lower bound
    (CER ~100%); a "predict nothing" baseline every real model must beat.

# --- hosted VLMs (LiteLLM) ----------------------------------------------------
# All go through litellm_client. Fields: litellm_id, env_key (skipped if unset),
# optional api_base / api_base_env, params, pricing (USD/1M, for cost estimate),
# optional max_tokens. run_hosted.py / notebook 02 run every one whose key is set.
# Pricing marked (verify) is a best-effort estimate — check the provider's page.

# Google
gemini-2.5-flash:
  client: litellm
  litellm_id: gemini/gemini-2.5-flash
  env_key: GEMINI_API_KEY          # Google AI Studio free tier works (rate-limited)
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.30, output_usd_per_1m: 2.50 }
  card: >-
    Google's fast multimodal model. General-purpose vision-language, not OCR-tuned;
    strong at reading printed and clear handwritten text. Free AI Studio tier.
gemini-2.5-flash-lite:
  client: litellm
  litellm_id: gemini/gemini-2.5-flash-lite
  env_key: GEMINI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.10, output_usd_per_1m: 0.40 }   # (verify)
  card: >-
    Google's cheapest/fastest Gemini. Useful as a low-cost baseline row.
gemini-2.5-pro:
  client: litellm
  litellm_id: gemini/gemini-2.5-pro
  env_key: GEMINI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.25, output_usd_per_1m: 10.00 }
  card: >-
    Google's larger multimodal model — slower and pricier than Flash, generally
    more accurate on hard images. General-purpose, not OCR-specialised.

# OpenAI
gpt-4o:
  client: litellm
  litellm_id: openai/gpt-4o
  env_key: OPENAI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 2.50, output_usd_per_1m: 10.00 }
  card: >-
    OpenAI's GPT-4o. Strong general vision-language reasoning and text reading;
    no Arabic-specific tuning.
gpt-4o-mini:
  client: litellm
  litellm_id: openai/gpt-4o-mini
  env_key: OPENAI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.15, output_usd_per_1m: 0.60 }
  card: >-
    OpenAI's small vision model — cheap baseline; weaker on dense/degraded script.
gpt-4.1:
  client: litellm
  litellm_id: openai/gpt-4.1
  env_key: OPENAI_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 8.00 }   # (verify)
  card: >-
    OpenAI GPT-4.1 — improved instruction following over 4o; vision-capable.
gpt-5:
  client: litellm
  litellm_id: openai/gpt-5
  env_key: OPENAI_API_KEY
  params: {}                                   # some GPT-5 tiers reject temperature
  pricing: { input_usd_per_1m: 1.25, output_usd_per_1m: 10.00 }   # (verify)
  card: >-
    OpenAI's GPT-5 (vision). Verify availability/pricing on your account.

# Mistral
pixtral-12b:
  client: litellm
  litellm_id: mistral/pixtral-12b-2409
  env_key: MISTRAL_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.15, output_usd_per_1m: 0.15 }   # (verify)
  card: >-
    Mistral's open vision-language model (12B), served via Mistral's API. Free
    tier available. A useful open-weight comparison point without local GPU.
mistral-small:
  client: litellm
  litellm_id: mistral/mistral-small-latest
  env_key: MISTRAL_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.20, output_usd_per_1m: 0.60 }   # (verify)
  card: >-
    Mistral Small (multimodal). Small, cheap, general-purpose.

# OpenRouter — one key, routes to many providers incl. free ($0) models
openrouter-qwen2.5-vl-72b:
  client: litellm
  litellm_id: openrouter/qwen/qwen2.5-vl-72b-instruct
  env_key: OPENROUTER_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.70, output_usd_per_1m: 0.70 }   # (verify)
  card: >-
    Qwen2.5-VL 72B via OpenRouter — a large open VLM with strong OCR, no local
    GPU needed. OpenRouter also exposes many models on one key.
openrouter-llama-3.2-90b-vision:
  client: litellm
  litellm_id: openrouter/meta-llama/llama-3.2-90b-vision-instruct
  env_key: OPENROUTER_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.80, output_usd_per_1m: 0.80 }   # (verify)
  card: >-
    Llama 3.2 90B Vision via OpenRouter. Weaker on non-Latin script but a common
    open baseline.

# Ollama cloud (ollama.com) — OpenAI-compatible; set OLLAMA_API_BASE + OLLAMA_API_KEY.
# Replace the tags with models you've enabled on your Ollama account.
ollama-qwen2.5-vl:
  client: litellm
  litellm_id: openai/qwen2.5-vl:7b
  env_key: OLLAMA_API_KEY
  api_base_env: OLLAMA_API_BASE
  params: { temperature: 0 }
  pricing: null
  card: >-
    Qwen2.5-VL 7B served from Ollama cloud (or a local Ollama) via its
    OpenAI-compatible endpoint. Strong open OCR model.
ollama-llama3.2-vision:
  client: litellm
  litellm_id: openai/llama3.2-vision:11b
  env_key: OLLAMA_API_KEY
  api_base_env: OLLAMA_API_BASE
  params: { temperature: 0 }
  pricing: null
  card: >-
    Llama 3.2 Vision 11B via Ollama's OpenAI-compatible endpoint.
claude-haiku:
  client: litellm
  litellm_id: anthropic/claude-haiku-4-5
  env_key: ANTHROPIC_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.00, output_usd_per_1m: 5.00 }
  card: >-
    Anthropic's small, fast model (Haiku 4.5). Cheapest of the Claude tier;
    general-purpose, not OCR-specialised.
claude-sonnet:
  client: litellm
  litellm_id: anthropic/claude-sonnet-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Sonnet 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 10.00 }
  card: >-
    Anthropic's mid-tier model (Sonnet 5). Careful transcriber that tends to
    preserve diacritics well; general-purpose, not OCR-specialised.
claude-opus:
  client: litellm
  litellm_id: anthropic/claude-opus-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Opus 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 5.00, output_usd_per_1m: 25.00 }
  card: >-
    Anthropic's most capable widely-released model (Opus 5). Strongest general
    vision-language reasoning in the set; no Arabic-specific tuning. Priciest.

# --- local open-weight / Arabic-specific VLMs (needs: uv sync --extra local)
qari-ocr-0.3:
  client: hf_local
  hf_id: NAMAA-Space/Qari-OCR-v0.3-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's Arabic OCR model, 2B params, fine-tuned from Qwen2-VL-2B. The
    v0.3 line is "structure-first" — tuned for full-page documents with layout and
    Markdown output, so on single lines it can add markup or over-generate.
qari-ocr-0.2:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  adapter_id: NAMAA-Space/Qari-OCR-0.2.2.1-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's earlier Arabic OCR checkpoint (v0.2.2.1), a LoRA adapter on
    Qwen2-VL-2B, tuned for raw-text accuracy on diacritically rich Arabic. Reports
    the best character accuracy of the Qari line on its own benchmark.
qwen2-vl-2b:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    Alibaba's Qwen2-VL, 2B params, untuned. The base model the Qari checkpoints
    are built on — its row shows how much the Arabic OCR fine-tuning actually buys.
qwen2.5-vl-3b:
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-3B-Instruct
  arch: qwen2_5_vl
  dtype: bfloat16
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 3B params. A capable general-purpose vision-language
    model with notably strong OCR across scripts; no Arabic-specific tuning.
qwen2.5-vl-7b:
  # 4-bit on a T4 (drop load_in_4bit on a 24 GB+ GPU). Dropped in CPU mode.
  # Needs: pip install bitsandbytes
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-7B-Instruct
  arch: qwen2_5_vl
  dtype: bfloat16
  load_in_4bit: true
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 7B params, run 4-bit-quantized to fit a 16 GB GPU. The
    larger general-purpose VLM in the set; strong multilingual OCR, no Arabic tuning.
ain-7b:
  # 4-bit on a T4; dropped automatically in CPU mode.
  client: hf_local
  hf_id: MBZUAI/AIN
  arch: qwen2_vl
  dtype: float16
  load_in_4bit: true
  pricing: null
  card: >-
    AIN (MBZUAI), an Arabic-centric vision-language model built on Qwen2-VL-7B and
    trained on a large bilingual Arabic-English multimodal corpus. Run 4-bit here.
paligemma-arabic-hw:
  client: hf_local
  hf_id: google/paligemma-3b-pt-448           # gated base
  adapter_id: Nada2125/paligemma-3b-arabic-handwritten-ocr-1
  arch: paligemma
  dtype: bfloat16
  pricing: null
  card: >-
    A community LoRA adapter for Arabic handwritten OCR on Google's PaliGemma-3B
    (gated). Trained on single handwritten lines — line-track only, not pages.
