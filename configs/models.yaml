  litellm_id: openai/gpt-5.6-luna
  env_key: OPENAI_API_KEY_PAID
  params: { reasoning_effort: none }            # "minimal" is ignored by this model; "none" is a distinct, lower level — probing it
  max_tokens: 8000                             # headroom: reasoning ~2k tok before the answer
  pricing: { input_usd_per_1m: 0.20, output_usd_per_1m: 1.20 }
  card: >-
    OpenAI GPT-5.6 "luna" on the paid key — the small/cheap GPT-5.6 tier.
    Reasoning model; ignores reasoning_effort=minimal, so probing
    reasoning_effort=none (a distinct, lower value than minimal) instead.
    Cheapest GPT-5.6 row.

gpt-6-astra-paid:
  client: litellm
  litellm_id: openai/gpt-6-astra
  env_key: OPENAI_API_KEY_PAID
  params: { reasoning_effort: low }              # Astra rejects reasoning_effort=none with a 400 (per OpenAI docs); low is its floor
  max_tokens: 4000
  pricing: { input_usd_per_1m: 10.00, output_usd_per_1m: 50.00 }
  card: >-
    OpenAI's flagship GPT-6 Astra on the paid key. Not yet run here — a
    single-sample probe only, at reasoning_effort=low (its lowest supported
    level; "none"/"minimal" 400). Most expensive row by far ($10/$50 per 1M);
    treat any per-dataset projection as an upper-bound estimate, not a plan
    to actually run it at scale without discussing cost first.

# Z.AI (bigmodel) — OpenAI-compatible endpoint at https://api.z.ai/api/paas/v4.
# Plain GLM-5.3 is text-only per Z.AI's own docs; GLM-5.3-Flash is the model its
# dedicated docs page describes as multimodal ("Video / Image / Text / File") —
# unconfirmed against this benchmark's specific OCR task until the first probe.
glm-5.3-flash-paid:
  client: litellm
  litellm_id: openai/glm-5.3-flash
  env_key: ZAI_API_KEY_PAID
  api_base: https://api.z.ai/api/paas/v4
  params: { temperature: 0 }  # reasoning_effort tested (low) — see card note below on why it was dropped
  max_tokens: 4000                             # reasoning model: empty content at 256. A single-sample probe at
                                                # max_tokens=40000 showed the hardest lines can need >12k tokens to
                                                # answer at all — kept at 4000 here to stay comparable with the
                                                # already-reported N=10 run; raise it if a real re-run is wanted.
  pricing: { input_usd_per_1m: 0.15, output_usd_per_1m: 0.50 }   # list price (verify — currently ~50% promo)
  card: >-
    Z.AI's GLM-5.3-Flash on the paid key. Cheap, native multimodal
    (image/video/text/file) input — confirmed working on handwritten Arabic
    line images (N=10, kitab_muharaf/kitab_khatt). Spends a large hidden
    reasoning budget before answering (hundreds to the full 4000-token cap,
    even for a short line), so cost/line is higher than the token price alone
    suggests. Per Z.AI's docs, thinking cannot be disabled on GLM-5.3(-Flash);
    tried `reasoning_effort: low` and it did not help — the same sample still
    burned its whole budget on some calls with `low` set, so the setting was
    dropped rather than kept for no benefit. Plain GLM-5.3 (no -Flash) is
    text-only, so it is not included here.

# --- local open-weight / Arabic-specific VLMs (needs: uv sync --extra local)
qari-ocr-0.3:
  client: hf_local
  hf_id: NAMAA-Space/Qari-OCR-v0.3-VL-2B-Instruct
  arch: qwen2_vl
  min_ram_gb: 7       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's Arabic OCR model, 2B params, fine-tuned from Qwen2-VL-2B. The
    v0.3 line is "structure-first" — tuned for full-page documents with layout and
    Markdown output, so on single lines it can add markup or over-generate.
qari-ocr-0.2:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  adapter_id: NAMAA-Space/Qari-OCR-0.2.2.1-VL-2B-Instruct
  arch: qwen2_vl
  min_ram_gb: 7       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's earlier Arabic OCR checkpoint (v0.2.2.1), a LoRA adapter on
    Qwen2-VL-2B, tuned for raw-text accuracy on diacritically rich Arabic. Reports
    the best character accuracy of the Qari line on its own benchmark.
qwen2-vl-2b:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  arch: qwen2_vl
  min_ram_gb: 7       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: float16
  pricing: null
  card: >-
    Alibaba's Qwen2-VL, 2B params, untuned. The base model the Qari checkpoints
    are built on — its row shows how much the Arabic OCR fine-tuning actually buys.
qwen2.5-vl-3b:
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-3B-Instruct
  arch: qwen2_5_vl
  min_ram_gb: 11       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: bfloat16
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 3B params. A capable general-purpose vision-language
    model with notably strong OCR across scripts; no Arabic-specific tuning.
qwen2.5-vl-7b:
  # 4-bit on a T4 (drop load_in_4bit on a 24 GB+ GPU). Dropped in CPU mode.
  # Needs: pip install bitsandbytes
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-7B-Instruct
  arch: qwen2_5_vl
  min_ram_gb: 22       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: bfloat16
  load_in_4bit: true
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 7B params, run 4-bit-quantized to fit a 16 GB GPU. The
    larger general-purpose VLM in the set; strong multilingual OCR, no Arabic tuning.
ain-7b:
  # 4-bit on a T4; dropped automatically in CPU mode.
  client: hf_local
  hf_id: MBZUAI/AIN
  arch: qwen2_vl
  min_ram_gb: 22       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: float16
  load_in_4bit: true
  pricing: null
  card: >-
    AIN (MBZUAI), an Arabic-centric vision-language model built on Qwen2-VL-7B and
    trained on a large bilingual Arabic-English multimodal corpus. Run 4-bit here.
paligemma-arabic-hw:
  client: hf_local
  hf_id: google/paligemma-3b-pt-448           # gated base
  adapter_id: Nada2125/paligemma-3b-arabic-handwritten-ocr-1
  arch: paligemma
  min_ram_gb: 10       # CPU: skip (don't OOM-kill) if less free RAM
  dtype: bfloat16
  pricing: null
  card: >-
    A community LoRA adapter for Arabic handwritten OCR on Google's PaliGemma-3B
    (gated). Trained on single handwritten lines — line-track only, not pages.
trocr-large-arabic:
  client: hf_local
  hf_id: David-Magdy/TR_OCR_LARGE
  arch: trocr
  min_ram_gb: 4       # CPU: skip (don't OOM-kill) if less free RAM
  max_new_tokens: 96
  pricing: null
  card: >-
    TrOCR-Large (0.6B, vision-encoder-decoder) finetuned for Arabic + English
    handwriting on KHATT and IAM. A dedicated HTR model rather than a general
    VLM — no prompt, single-line only. Runs on CPU/MPS; expect it to do best on
    KHATT-like lines and worse on out-of-distribution scripts (e.g. Muharaf).
minicpm-v:
  # custom model.chat() API (trust_remote_code); 4-bit on a T4, dropped in CPU mode.
  # Needs: pip install bitsandbytes
  client: hf_local
  hf_id: openbmb/MiniCPM-V-2_6
  arch: minicpmv
  min_ram_gb: 22       # CPU: skip (don't OOM-kill) if less free RAM
  load_in_4bit: true
  max_new_tokens: 160
  pricing: null
  card: >-
    MiniCPM-V 2.6 (8B), a compact multimodal model with multilingual document
    OCR across 30+ languages including Arabic. The strongest non-Qwen small VLM
    in the set; also the one to run locally via Ollama (`ollama pull minicpm-v`).
