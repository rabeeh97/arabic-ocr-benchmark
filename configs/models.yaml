openrouter-llama-4-maverick:
  client: litellm
  litellm_id: openrouter/meta-llama/llama-4-maverick
  env_key: OPENROUTER_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 0.20, output_usd_per_1m: 0.70 }   # (verify)
  card: >-
    Meta Llama 4 Maverick (multimodal MoE) via OpenRouter. A current open
    baseline; historically weaker on non-Latin script than Qwen-VL.

# Ollama — OpenAI-compatible endpoint; set OLLAMA_API_BASE + OLLAMA_API_KEY.
# NOTE: as of 2026 the Ollama *cloud* (https://ollama.com/v1) serves only text
# LLMs — NO vision models. These entries only work against a LOCAL Ollama:
#     ollama serve
#     ollama pull qwen2.5vl:3b        # ~3.2 GB, best small Arabic-capable VLM
#     ollama pull qwen2.5vl:7b        # ~6 GB, clearly better if the box allows
#     ollama pull minicpm-v           # ~5.5 GB, 8B, explicitly multilingual OCR
# then in .env:  OLLAMA_API_BASE=http://localhost:11434/v1  (OLLAMA_API_KEY=ollama)
# Uncomment the rows for whatever you pulled. Left commented so the hosted sweep
# doesn't try (and fail) them while OLLAMA_API_BASE still points at the cloud.
# Avoid llava / bakllava / moondream / granite-vision here — weak on Arabic.
# ollama-qwen2.5vl-3b:
#   client: litellm
#   litellm_id: openai/qwen2.5vl:3b
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     Qwen2.5-VL 3B via a local Ollama. Smallest model with genuine Arabic OCR
#     ability — same family that leads the hosted board at 72B/235B.
# ollama-qwen2.5vl-7b:
#   client: litellm
#   litellm_id: openai/qwen2.5vl:7b
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     Qwen2.5-VL 7B via a local Ollama. Noticeably stronger than the 3B; the
#     practical local OCR pick when there's ~8 GB of RAM/VRAM to spare.
# ollama-minicpm-v:
#   client: litellm
#   litellm_id: openai/minicpm-v
#   env_key: OLLAMA_API_KEY
#   api_base_env: OLLAMA_API_BASE
#   params: { temperature: 0 }
#   pricing: null
#   card: >-
#     MiniCPM-V 8B via a local Ollama. Multilingual document OCR (30+ languages
#     incl. Arabic); a useful non-Qwen small-model comparison point.
claude-haiku:
  client: litellm
  litellm_id: anthropic/claude-haiku-4-5
  env_key: ANTHROPIC_API_KEY
  params: { temperature: 0 }
  pricing: { input_usd_per_1m: 1.00, output_usd_per_1m: 5.00 }
  card: >-
    Anthropic's small, fast model (Haiku 4.5). Cheapest of the Claude tier;
    general-purpose, not OCR-specialised.
claude-sonnet:
  client: litellm
  litellm_id: anthropic/claude-sonnet-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Sonnet 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 2.00, output_usd_per_1m: 10.00 }
  card: >-
    Anthropic's mid-tier model (Sonnet 5). Careful transcriber that tends to
    preserve diacritics well; general-purpose, not OCR-specialised.
claude-opus:
  client: litellm
  litellm_id: anthropic/claude-opus-5
  env_key: ANTHROPIC_API_KEY
  params: {}                                   # Opus 5 rejects temperature/top_p
  pricing: { input_usd_per_1m: 5.00, output_usd_per_1m: 25.00 }
  card: >-
    Anthropic's most capable widely-released model (Opus 5). Strongest general
    vision-language reasoning in the set; no Arabic-specific tuning. Priciest.

# --- local open-weight / Arabic-specific VLMs (needs: uv sync --extra local)
qari-ocr-0.3:
  client: hf_local
  hf_id: NAMAA-Space/Qari-OCR-v0.3-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's Arabic OCR model, 2B params, fine-tuned from Qwen2-VL-2B. The
    v0.3 line is "structure-first" — tuned for full-page documents with layout and
    Markdown output, so on single lines it can add markup or over-generate.
qari-ocr-0.2:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  adapter_id: NAMAA-Space/Qari-OCR-0.2.2.1-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    NAMAA-Space's earlier Arabic OCR checkpoint (v0.2.2.1), a LoRA adapter on
    Qwen2-VL-2B, tuned for raw-text accuracy on diacritically rich Arabic. Reports
    the best character accuracy of the Qari line on its own benchmark.
qwen2-vl-2b:
  client: hf_local
  hf_id: Qwen/Qwen2-VL-2B-Instruct
  arch: qwen2_vl
  dtype: float16
  pricing: null
  card: >-
    Alibaba's Qwen2-VL, 2B params, untuned. The base model the Qari checkpoints
    are built on — its row shows how much the Arabic OCR fine-tuning actually buys.
qwen2.5-vl-3b:
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-3B-Instruct
  arch: qwen2_5_vl
  dtype: bfloat16
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 3B params. A capable general-purpose vision-language
    model with notably strong OCR across scripts; no Arabic-specific tuning.
qwen2.5-vl-7b:
  # 4-bit on a T4 (drop load_in_4bit on a 24 GB+ GPU). Dropped in CPU mode.
  # Needs: pip install bitsandbytes
  client: hf_local
  hf_id: Qwen/Qwen2.5-VL-7B-Instruct
  arch: qwen2_5_vl
  dtype: bfloat16
  load_in_4bit: true
  pricing: null
  card: >-
    Alibaba's Qwen2.5-VL, 7B params, run 4-bit-quantized to fit a 16 GB GPU. The
    larger general-purpose VLM in the set; strong multilingual OCR, no Arabic tuning.
ain-7b:
  # 4-bit on a T4; dropped automatically in CPU mode.
  client: hf_local
  hf_id: MBZUAI/AIN
  arch: qwen2_vl
  dtype: float16
  load_in_4bit: true
  pricing: null
  card: >-
    AIN (MBZUAI), an Arabic-centric vision-language model built on Qwen2-VL-7B and
    trained on a large bilingual Arabic-English multimodal corpus. Run 4-bit here.
paligemma-arabic-hw:
  client: hf_local
  hf_id: google/paligemma-3b-pt-448           # gated base
  adapter_id: Nada2125/paligemma-3b-arabic-handwritten-ocr-1
  arch: paligemma
  dtype: bfloat16
  pricing: null
  card: >-
    A community LoRA adapter for Arabic handwritten OCR on Google's PaliGemma-3B
    (gated). Trained on single handwritten lines — line-track only, not pages.
trocr-large-arabic:
  client: hf_local
  hf_id: David-Magdy/TR_OCR_LARGE
  arch: trocr
  max_new_tokens: 96
  pricing: null
  card: >-
    TrOCR-Large (0.6B, vision-encoder-decoder) finetuned for Arabic + English
    handwriting on KHATT and IAM. A dedicated HTR model rather than a general
    VLM — no prompt, single-line only. Runs on CPU/MPS; expect it to do best on
    KHATT-like lines and worse on out-of-distribution scripts (e.g. Muharaf).
