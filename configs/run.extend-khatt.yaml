# Ad-hoc top-up: 10 NEW, distinct KHATT lines (offset past the rows already
# scored in the 2026-08-31 hosted sweep) for the free-tier hosted models, so
# the leaderboard merge grows n=12 -> n=22 instead of re-spending credits on
# lines already scored.
models:
  - gemini-flash-lite
  - pixtral-12b
  - mistral-small
  - openrouter-qwen2.5-vl-72b
  - openrouter-qwen3-vl-235b
  - openrouter-llama-4-maverick

datasets:
  - kitab_khatt

limit: 10
offset: 12
prompt_version: line-v2
normalization_profiles: [raw, light, diac_insensitive]

concurrency: 4
max_retries: 3
cache: true
results_dir: results
